<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>U.S. Debt Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
   <style>
  :root { --w: 1980; --h: 1280; }     /* <-- set to your image’s exact pixels */

  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#000;font-family:system-ui,Roboto,Arial,sans-serif}

  /* Fill the width; letterbox vertically if needed */
  .wrap{
    position:relative;
    width:100vw;
    aspect-ratio: calc(var(--w) / var(--h));
    overflow:hidden;
  }

  .stage{
    position:absolute; inset:0;
    width:calc(var(--w)*1px); height:calc(var(--h)*1px);
    transform-origin:top left;
    --sx: calc(100% / (var(--w)*1px));
    --sy: calc(100% / (var(--h)*1px));
    transform: scale(var(--sx), var(--sy));
    background:url('background.png') no-repeat 0 0 / 100% 100%;
  }

  /* Your single number slot (coords in design pixels) */
  #slot-number{
    position:absolute;
    left: 320px; top: 180px; width: 520px; height: 96px;
    display:grid; place-items:center; text-align:center;
    font-size:72px; line-height:1; letter-spacing:1px; font-weight:700;
  }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <!-- Mount the number directly into this slot.
           Give it the class the embed expects (ntd-debt-clock). -->
      <div id="slot-number" class="ntd-debt-clock"></div>
    </div>
  </div>

  <!-- Your widget script (unchanged) -->
  <script src="https://ntdservices-debt-clock.hf.space/static/embed.js" defer></script>

  <script>
    /* If the embed supports a JS API to mount to a specific element, use it:
       DebtClockEmbed?.mount({ container: document.getElementById('slot-number') });

       If not, most “embed.js” scripts simply fill the first .ntd-debt-clock element
       they find — which we’ve made be the #slot-number already. */
  </script>
</body>
</html>
