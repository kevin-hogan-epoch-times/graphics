<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Debt Clock – Single Number, Locked Position</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* 1) Use your background's real pixel size */
    :root { --w: 1920; --h: 1080; }

    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #000;
      font-family: system-ui, Roboto, Arial, sans-serif;
    }

    /* 2) Responsive wrapper that preserves aspect ratio */
    .wrap {
      position: relative;
      width: min(100vw, 100vh * (var(--w) / var(--h)));
      aspect-ratio: calc(var(--w) / var(--h));
      overflow: hidden;
    }

    /* 3) Fixed-coordinate stage at design pixels; we scale it to the wrapper */
    .stage {
      position: absolute; inset: 0;
      width: calc(var(--w) * 1px);
      height: calc(var(--h) * 1px);
      transform-origin: top left;
      --sx: calc(100% / (var(--w) * 1px));
      --sy: calc(100% / (var(--h) * 1px));
      transform: scale(var(--sx), var(--sy));
      background: url('background.png') no-repeat 0 0 / 100% 100%;
    }

    /* 4) Single slot where the number will render.
          Coordinates are in *design pixels* from your artboard. */
    #slot-number {
      position: absolute;
      left: 320px;    /* X position in your design */
      top: 180px;     /* Y position in your design */
      width: 520px;   /* slot width in your design */
      height: 96px;   /* slot height in your design */

      /* Center the content inside the slot */
      display: grid;
      place-items: center;
      text-align: center;

      /* Optional: choose a design font-size & letter spacing in design px.
         These will scale perfectly with the stage. */
      font-size: 72px;
      line-height: 1;
      letter-spacing: 1px;
      font-weight: 700;

      /* Remove after aligning */
      /* outline: 1px dashed rgba(0,255,255,.35); */
    }

    /* If your embed injects its own element with .ntd-debt-clock,
       we add a tiny reset so it fills the slot nicely. */
    #slot-number > .ntd-debt-clock,
    #slot-number.ntd-debt-clock {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      pointer-events: none; /* optional */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <!-- Mount the number directly into this slot.
           Give it the class the embed expects (ntd-debt-clock). -->
      <div id="slot-number" class="ntd-debt-clock"></div>
    </div>
  </div>

  <!-- Your widget script (unchanged) -->
  <script src="https://ntdservices-debt-clock.hf.space/static/embed.js" defer></script>

  <script>
    /* If the embed supports a JS API to mount to a specific element, use it:
       DebtClockEmbed?.mount({ container: document.getElementById('slot-number') });

       If not, most “embed.js” scripts simply fill the first .ntd-debt-clock element
       they find — which we’ve made be the #slot-number already. */
  </script>
</body>
</html>
