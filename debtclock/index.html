<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>U.S. Debt Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>

    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #000; font-family: system-ui, Roboto, Arial, sans-serif; }


    :root {
      --design-w: 1600;
      --design-h: 900;
      --scale: min(100dvw / var(--design-w), 100dvh / var(--design-h));
    }

    .viewport{
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      transform: scale(var(--scale));
      transform-origin: top left;
      overflow: hidden;
    }

    
    .stage {
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      position: relative;
      background: url('background.png') no-repeat 0 0 / 100% 100%;
    }


    .ntd-debt-clock {
      position: absolute;
      top: 180px;   
      left: 320px;
      transform: none;
    }

   
    .slot-national-debt {
      position: absolute;
      left: 320px;   
      top: 180px;    
      width: 520px;  
      height: 96px;  
      display: grid;
      place-items: center;
      pointer-events: none;
      outline: 1px dashed rgba(0,255,255,.3);
    }
  </style>
</head>
<body>

 <div class="viewport">
  <div class="stage">
    
    <div class="ntd-debt-clock" id="debt-widget"></div>

    
    <div class="slot-national-debt" id="slot-national-debt"></div>
    
  </div>
</div>

  <script src="https://ntdservices-debt-clock.hf.space/static/embed.js" defer></script>
  <script>
  
  </script>
</body>
</html>
